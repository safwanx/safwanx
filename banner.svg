<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1200 160" width="1200" height="160" role="img" aria-labelledby="title desc">
<title id="title">A little ultimate frisbee between experiments</title>
<desc id="desc">A disc glides along a curved flight path.</desc>
<defs>
<linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e3d9cc"/></linearGradient>
<g id="disc"><ellipse cx="0" cy="5" rx="42" ry="10" fill="#b5a897"/><ellipse cx="0" cy="0" rx="42" ry="10" fill="url(#top)"/><ellipse cx="0" cy="-0.6" rx="32" ry="6.4" fill="none" stroke="#35766a" stroke-opacity="0.35" stroke-width="1.1"/><ellipse cx="0" cy="-0.6" rx="20" ry="4" fill="none" stroke="#35766a" stroke-opacity="0.25" stroke-width="1"/><circle r="2.8" fill="#35766a"><animateMotion path="M 27 -0.6 A 27 5.4 0 1 1 -27 -0.6 A 27 5.4 0 1 1 27 -0.6" dur="0.5s" begin="0s" repeatCount="indefinite"/></circle></g>
</defs>
<style>
.flight-path { stroke: #8daea5; }
.still { display: none; }
@media (prefers-reduced-motion: reduce) {
  .flying { display: none; }
  .still { display: inline; }
}
</style>
<path class="flight-path" d="M 20 146 C 320 82, 700 76, 1180 135" fill="none" stroke-width="1.5" stroke-dasharray="3 12" opacity=".55"/>
<g class="flying"><g opacity="0.28"><g transform="rotate(-5)"><use href="#disc"/></g><animateMotion path="M -110 172 C 240 92, 640 66, 1320 150" dur="6.4s" begin="0.06s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.14;0.86;1" keyPoints="0;0;1;1" keySplines="0 0 1 1;0.3 0.05 0.6 1;0 0 1 1" rotate="auto"/></g><g opacity="0.16"><g transform="rotate(-5)"><use href="#disc"/></g><animateMotion path="M -110 172 C 240 92, 640 66, 1320 150" dur="6.4s" begin="0.12s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.14;0.86;1" keyPoints="0;0;1;1" keySplines="0 0 1 1;0.3 0.05 0.6 1;0 0 1 1" rotate="auto"/></g><g opacity="0.08"><g transform="rotate(-5)"><use href="#disc"/></g><animateMotion path="M -110 172 C 240 92, 640 66, 1320 150" dur="6.4s" begin="0.18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.14;0.86;1" keyPoints="0;0;1;1" keySplines="0 0 1 1;0.3 0.05 0.6 1;0 0 1 1" rotate="auto"/></g>
<g><g transform="rotate(-5)"><use href="#disc"/></g><animateMotion path="M -110 172 C 240 92, 640 66, 1320 150" dur="6.4s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.14;0.86;1" keyPoints="0;0;1;1" keySplines="0 0 1 1;0.3 0.05 0.6 1;0 0 1 1" rotate="auto"/></g>
</g>
<g class="still" transform="translate(600 102) rotate(-5)"><ellipse cy="5" rx="42" ry="10" fill="#b5a897"/><ellipse rx="42" ry="10" fill="url(#top)"/><ellipse cy="-0.6" rx="32" ry="6.4" fill="none" stroke="#35766a" stroke-opacity=".35" stroke-width="1.1"/></g>
</svg>
